<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Levels</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="levels.css">
</head>
<body>
  <div class="levels-page">
    <div class="settings-panel levels-panel">
      <div class="panel-header">
        <div class="header-content">
          <h2>📚 Levels</h2>
          <select id="flow-select"></select>
          <div class="search-control" role="search">
            <span class="search-icon" aria-hidden="true">🔍</span>
            <input id="level-filter" class="search-input" type="search" placeholder="Search name or ID" autocomplete="off" />
            <button id="level-filter-clear" class="search-clear" type="button" aria-label="Clear search" title="Clear">×</button>
          </div>
          <button class="theme-toggle" id="theme-toggle" title="Toggle theme">
            <span class="theme-icon">🌙</span>
          </button>
        </div>
        <div class="pagination">
          <button id="prev-page" class="nav-button">‹</button>
          <span id="page-info"></span>
          <button id="next-page" class="nav-button">›</button>
        </div>
      </div>

      <div class="levels-content">
        <div id="levels-grid" class="levels-grid"></div>
      </div>
    </div>
    <div id="level-properties" class="settings-panel property-panel">
      <div class="panel-header">
        <div class="header-content">
          <h2>🔧 Properties</h2>
        </div>
      </div>
      <div class="settings-section">
        <div class="form-group" id="multi-select-info" style="display:none"></div>
        <div class="form-group">
          <label for="prop-id">ID</label>
          <input id="prop-id" type="text" readonly>
        </div>
        <div class="form-group">
          <label for="prop-ordinal">Ordinal</label>
          <input type="number" id="prop-ordinal">
        </div>
        <button id="prop-update" class="action-button">Update</button>
        <button id="prop-duplicate" class="action-button">Duplicate</button>
        <button id="prop-play" class="action-button">Play</button>
        <button id="prop-delete" class="action-button remove">Delete</button>

        <div class="form-group" id="tags-group">
          <label>Tags</label>
          <div id="tags-list" class="tags-list"></div>
          <div class="tag-input-group">
            <input id="tag-input" type="text" list="tags-suggestions" placeholder="Add tag..." autocomplete="off" />
            <datalist id="tags-suggestions"></datalist>
            <button id="tag-add" class="action-button" type="button">Add</button>
          </div>
        </div>

        <div class="form-group">
          <label for="flow-target-select">Target Flow</label>
          <select id="flow-target-select"></select>
        </div>
        <div class="form-group">
          <button id="prop-copy-to" class="action-button">Copy To Flow</button>
          <button id="prop-move-to" class="action-button remove">Move To Flow</button>
        </div>
      </div>
    </div>
  </div>
  <!-- Toast container -->
  <div id="toast-container" class="toast-container" aria-live="polite" aria-atomic="true"></div>
  <script src="levels.js"></script>
</body>
</html>
