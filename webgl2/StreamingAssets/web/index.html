<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Level Editor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
<div class="sidebar-left">
      <div class="settings-panel">
        <div class="panel-header">
          <div class="header-content">
            <h2>⚙️ Level Settings</h2>
            <button class="theme-toggle" id="theme-toggle" title="Toggle theme">
              <span class="theme-icon">🌙</span>
            </button>
          </div>
        </div>
        
        <div class="settings-section">
          <div class="form-group">
            <label for="level-name">Level Name</label>
            <input id="level-name" type="text" value="My Custom Level">
          </div>
          
          <div class="form-row">
            <div class="form-group">
              <label for="level-seed">Seed</label>
              <input id="level-seed" type="number" value="0">
            </div>
            <div class="form-group">
              <label for="level-moves">Moves</label>
              <input id="level-moves" type="number" value="25">
            </div>
          </div>
          
          <div class="form-row">
            <div class="form-group">
              <label for="powerup-chance">PowerUp Spawn Chance</label>
              <input id="powerup-chance" type="number" step="0.01" min="0" max="1" value="0">
            </div>
            <div class="form-group">
              <label for="level-mode">Game Mode</label>
              <select id="level-mode">
                <option value="clearAll">Clear All</option>
                <option value="collection">Collection</option>
                <option value="score">Score</option>
              </select>
            </div>
          </div>
          
          <div class="form-row">
            <div class="form-group">
              <label for="gridWidth">Grid Width</label>
              <input id="gridWidth" type="number" min="2" max="11" value="8">
            </div>
            <div class="form-group">
              <label for="gridHeight">Grid Height</label>
              <input id="gridHeight" type="number" min="2" max="11" value="8">
            </div>
          </div>
          
          <div class="form-group">
            <label>Shape Groups</label>
            <div class="checkbox-group">
              <label class="checkbox-label">
                <input type="checkbox" id="shape-easy">
                <span>Easy</span>
              </label>
              <label class="checkbox-label">
                <input type="checkbox" id="shape-hard">
                <span>Hard</span>
              </label>
              <label class="checkbox-label">
                <input type="checkbox" id="shape-helper">
                <span>Helper</span>
              </label>
            </div>
          </div>
        </div>
        
        <div class="collapsible-section">
          <button class="section-toggle" data-target="goals-section" data-section="goals">
            <span class="toggle-text">🎯 Goals</span>
            <span class="toggle-icon">▼</span>
          </button>
          <div class="section-content" id="goals-section">
            <div id="goals-list" class="items-list"></div>
            <button id="add-goal-button" type="button" class="add-button">+ Add Goal</button>
          </div>
        </div>
        
        <div class="collapsible-section">
          <button class="section-toggle" data-target="group-weights-section" data-section="group-weights">
            <span class="toggle-text">👥 Group Weights</span>
            <span class="toggle-icon">▼</span>
          </button>
          <div class="section-content collapsed" id="group-weights-section">
            <div id="group-weights-list" class="items-list"></div>
            <button id="add-group-weight-button" type="button" class="add-button">+ Add Group Weight</button>
          </div>
        </div>
        
        <div class="collapsible-section">
          <button class="section-toggle" data-target="shape-weights-section" data-section="shape-weights">
            <span class="toggle-text">⚖️ Shape Weights</span>
            <span class="toggle-icon">▼</span>
          </button>
          <div class="section-content collapsed" id="shape-weights-section">
            <div id="shape-weights-list" class="items-list"></div>
            <button id="add-weight-button" type="button" class="add-button">+ Add Shape Weight</button>
          </div>
        </div>
        
        <div class="collapsible-section">
          <button class="section-toggle" data-target="starting-shapes-section" data-section="starting-shapes">
            <span class="toggle-text">🚀 Starting Shapes</span>
            <span class="toggle-icon">▼</span>
          </button>
          <div class="section-content collapsed" id="starting-shapes-section">
            <div id="starting-shapes-list" class="items-list"></div>
            <button id="add-starting-shape-button" type="button" class="add-button">+ Add Starting Shape</button>
          </div>
        </div>
      </div>
    </div>
    
    <div class="main-content">
      <div class="grid-section">
        <div class="grid-header">
          <h3>🎮 Level Grid</h3>
          <div class="grid-controls">
            <div class="grid-toolbar">
              <button id="prev-grid" type="button" class="nav-button">‹</button>
              <span id="grid-indicator" class="grid-indicator">Grid 1/1</span>
              <button id="next-grid" type="button" class="nav-button">›</button>
              <button id="add-grid" type="button" class="action-button">+ Grid</button>
              <button id="remove-grid" type="button" class="action-button remove">- Grid</button>
            </div>
          </div>
        </div>
        <div class="grid-container">
          <div class="grid" id="grid"></div>
        </div>
      </div>
    </div>
    
    <div class="sidebar-right">
        <div class="palette-panel">
        <div class="panel-header">
          <div class="header-content">
            <h2>🎨 Tools</h2>
          </div>
          <input type="text" id="palette-search" placeholder="Search tools..." class="search-input">
        </div>
        
        <div class="palette-grid" id="palette-buttons"></div>
        
        <div class="actions-section">
          <div class="action-buttons">
            <button class="action-btn undo-btn" data-action="undo">
              <span class="btn-icon">↩️</span>
              <span>Undo</span>
            </button>
            <button class="action-btn redo-btn" data-action="redo">
              <span class="btn-icon">↪️</span>
              <span>Redo</span>
            </button>
            <button class="action-btn new-btn" data-action="new">
              <span class="btn-icon">🆕</span>
              <span>New</span>
            </button>
            <button class="action-btn save-btn" data-action="save">
              <span class="btn-icon">💾</span>
              <span>Save</span>
            </button>
            <button class="action-btn load-btn" data-action="load">
              <span class="btn-icon">📁</span>
              <span>Load</span>
            </button>
            <button class="action-btn upload-btn" data-action="upload">
              <span class="btn-icon">🎮</span>
              <span>Play</span>
            </button>
            <button class="action-btn copy-btn" data-action="copy">
              <span class="btn-icon">📋</span>
              <span>Copy</span>
            </button>
            <button class="action-btn screenshot-btn" data-action="screenshot">
              <span class="btn-icon">📸</span>
              <span>Screenshot</span>
            </button>
            <a id="levels-link" class="action-btn" href="/levels" hidden>
              <span class="btn-icon">📚</span>
              <span>Levels</span>
            </a>
          </div>
          <button class="shortcuts-btn" aria-label="Keyboard Shortcuts">?</button>
          <div id="shortcuts-popup" class="shortcuts-info hidden">
            <h5>Shortcuts</h5>
            <div class="shortcut">
              <kbd>Shift</kbd> + <kbd>Click</kbd> = Clear cell
            </div>
            <div class="shortcut">
              <kbd>Ctrl</kbd> + <kbd>S</kbd> = Save level
            </div>
            <div class="shortcut">
              <kbd>Ctrl</kbd> + <kbd>Z</kbd> = Undo
            </div>
            <div class="shortcut">
              <kbd>Ctrl</kbd> + <kbd>Y</kbd> = Redo
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  
  <script src="paletteDefinitions.js"></script>
  <script src="shapeDefinitions.js"></script>
  <script src="editor.js"></script>
</body>
</html>
